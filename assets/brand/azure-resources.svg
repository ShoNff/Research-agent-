<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gCanvas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f9fd"/><stop offset="1" stop-color="#e7eef8"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#d9a92e"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1c2d54" flood-opacity="0.16"/></filter>
    <marker id="arw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 Z" fill="#6b7da6"/></marker>
    <symbol id="sym-group" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1 1 0 0 1 1-1h4.8l2 2.2H20a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="sym-datacenter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="6" rx="1.2"/><rect x="3.5" y="14" width="17" height="6" rx="1.2"/><path d="M6.8 7h.01M6.8 17h.01"/><path d="M10.5 7H17M10.5 17H17"/></symbol>
    <symbol id="sym-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></symbol>
    <symbol id="sym-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 7.5 12 12 3 7.5 12 3Z"/><path d="M3 12l9 4.5L21 12"/><path d="M3 16.5 12 21l9-4.5"/></symbol>
    <symbol id="sym-storage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17"/><circle cx="7" cy="7.2" r="0.5" fill="currentColor"/><circle cx="7" cy="12" r="0.5" fill="currentColor"/><circle cx="7" cy="16.8" r="0.5" fill="currentColor"/></symbol>
    <symbol id="sym-app" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8.5h18"/><circle cx="6" cy="6.2" r="0.6" fill="currentColor"/><circle cx="8.2" cy="6.2" r="0.6" fill="currentColor"/></symbol>
    <symbol id="sym-gateway" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-4.5L20 8v13"/><path d="M9.5 21v-6a2.5 2.5 0 0 1 5 0v6"/><path d="M2.5 21h19"/></symbol>
    <symbol id="sym-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 4.5 5.5v6c0 4.7 3.2 8.4 7.5 10 4.3-1.6 7.5-5.3 7.5-10v-6Z"/><path d="M8.5 12l2.4 2.4L15.5 9.8"/></symbol>
    <symbol id="sym-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 l1.7 4.3 L18 9 l-4.3 1.7 L12 15 l-1.7-4.3 L6 9 l4.3-1.7 Z"/><path d="M18.5 14.5 l.8 2 l2 .8 l-2 .8 l-.8 2 l-.8-2 l-2-.8 l2-.8 Z"/></symbol>
  </defs>

  <rect width="1320" height="720" fill="url(#gCanvas)"/>

  <g data-reveal="rg">
    <g filter="url(#soft)"><rect x="528" y="40" width="264" height="72" rx="18" fill="url(#gGold)"/></g>
    <g transform="translate(556,58)" color="#5e4708"><use href="#sym-group" width="34" height="34"/></g>
    <text x="600" y="84" font-size="22" font-weight="800" fill="#3f300a">Resource Group</text>
  </g>

  <g data-reveal="core">
    <path d="M660 112 C 660 150, 204 150, 204 196" fill="none" stroke="#6b7da6" stroke-width="2" marker-end="url(#arw)"/>
    <path d="M660 112 C 660 150, 508 150, 508 196" fill="none" stroke="#6b7da6" stroke-width="2" marker-end="url(#arw)"/>
    <path d="M660 112 C 660 150, 812 150, 812 196" fill="none" stroke="#6b7da6" stroke-width="2" marker-end="url(#arw)"/>
    <path d="M660 112 C 660 150, 1116 150, 1116 196" fill="none" stroke="#6b7da6" stroke-width="2" marker-end="url(#arw)"/>
    <g filter="url(#soft)"><rect x="64" y="200" width="280" height="124" rx="14" fill="#ffffff" stroke="#d8e1f0"/><rect x="64" y="200" width="280" height="6" rx="3" fill="#4682b4"/></g>
    <g transform="translate(88,228)" color="#3a6fae"><use href="#sym-datacenter" width="38" height="38"/></g>
    <text x="138" y="252" font-size="19" font-weight="700" fill="#1c2d54">Virtual Machine</text>
    <text x="88" y="298" font-size="14" fill="#4a5b80">Compute you manage</text>
    <g filter="url(#soft)"><rect x="368" y="200" width="280" height="124" rx="14" fill="#ffffff" stroke="#d8e1f0"/><rect x="368" y="200" width="280" height="6" rx="3" fill="#4682b4"/></g>
    <g transform="translate(392,228)" color="#29417a"><use href="#sym-database" width="38" height="38"/></g>
    <text x="442" y="252" font-size="19" font-weight="700" fill="#1c2d54">SQL Database</text>
    <text x="392" y="298" font-size="14" fill="#4a5b80">Managed relational data</text>
    <g filter="url(#soft)"><rect x="672" y="200" width="280" height="124" rx="14" fill="#ffffff" stroke="#d8e1f0"/><rect x="672" y="200" width="280" height="6" rx="3" fill="#4682b4"/></g>
    <g transform="translate(696,228)" color="#3a6fae"><use href="#sym-layers" width="38" height="38"/></g>
    <text x="746" y="252" font-size="19" font-weight="700" fill="#1c2d54">Container</text>
    <text x="696" y="298" font-size="14" fill="#4a5b80">AKS / Container App</text>
    <g filter="url(#soft)"><rect x="976" y="200" width="280" height="124" rx="14" fill="#ffffff" stroke="#d8e1f0"/><rect x="976" y="200" width="280" height="6" rx="3" fill="#4682b4"/></g>
    <g transform="translate(1000,228)" color="#29417a"><use href="#sym-storage" width="38" height="38"/></g>
    <text x="1050" y="252" font-size="19" font-weight="700" fill="#1c2d54">Storage Account</text>
    <text x="1000" y="298" font-size="14" fill="#4a5b80">Blobs, files, queues</text>
  </g>

  <g data-reveal="more">
    <g filter="url(#soft)"><rect x="64" y="360" width="280" height="124" rx="14" fill="#ffffff" stroke="#d8e1f0"/><rect x="64" y="360" width="280" height="6" rx="3" fill="#5b91c8"/></g>
    <g transform="translate(88,388)" color="#3a6fae"><use href="#sym-app" width="38" height="38"/></g>
    <text x="138" y="412" font-size="19" font-weight="700" fill="#1c2d54">App Service</text>
    <text x="88" y="458" font-size="14" fill="#4a5b80">Web apps &amp; APIs</text>
    <g filter="url(#soft)"><rect x="368" y="360" width="280" height="124" rx="14" fill="#ffffff" stroke="#d8e1f0"/><rect x="368" y="360" width="280" height="6" rx="3" fill="#5b91c8"/></g>
    <g transform="translate(392,388)" color="#3a6fae"><use href="#sym-gateway" width="38" height="38"/></g>
    <text x="442" y="412" font-size="19" font-weight="700" fill="#1c2d54">Virtual Network</text>
    <text x="392" y="458" font-size="14" fill="#4a5b80">Private connectivity</text>
    <g filter="url(#soft)"><rect x="672" y="360" width="280" height="124" rx="14" fill="#ffffff" stroke="#d8e1f0"/><rect x="672" y="360" width="280" height="6" rx="3" fill="#5b91c8"/></g>
    <g transform="translate(696,388)" color="#b9881d"><use href="#sym-shield" width="38" height="38"/></g>
    <text x="746" y="412" font-size="19" font-weight="700" fill="#1c2d54">Key Vault</text>
    <text x="696" y="458" font-size="14" fill="#4a5b80">Secrets &amp; keys</text>
    <g filter="url(#soft)"><rect x="976" y="360" width="280" height="124" rx="14" fill="#ffffff" stroke="#d8e1f0"/><rect x="976" y="360" width="280" height="6" rx="3" fill="#5b91c8"/></g>
    <g transform="translate(1000,388)" color="#3a6fae"><use href="#sym-ai" width="38" height="38"/></g>
    <text x="1050" y="412" font-size="19" font-weight="700" fill="#1c2d54">Function App</text>
    <text x="1000" y="458" font-size="14" fill="#4a5b80">Event-driven compute</text>
  </g>

  <text x="660" y="556" text-anchor="middle" font-size="18" font-weight="700" fill="#34518f">Each one is a <tspan fill="#e8732b" font-style="italic">resource</tspan> — and resources always live inside a resource group.</text>
</svg>
