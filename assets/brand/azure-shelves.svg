<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 640" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gCanvas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f9fd"/><stop offset="1" stop-color="#e7eef8"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#d9a92e"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1c2d54" flood-opacity="0.16"/></filter>
    <marker id="arwG" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 Z" fill="#c79a1f"/></marker>
    <symbol id="sym-shelf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M3.5 9.5h17M3.5 15h17"/><path d="M6.5 6.5h3M6.5 12h3M6.5 17.5h3"/></symbol>
    <symbol id="sym-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l2.7 5.5 6 .9-4.35 4.24 1.03 6L12 16.9 6.62 19.4l1.03-6L3.3 9.2l6-.9Z"/></symbol>
    <symbol id="sym-storage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17"/><circle cx="7" cy="7.2" r="0.5" fill="currentColor"/><circle cx="7" cy="12" r="0.5" fill="currentColor"/><circle cx="7" cy="16.8" r="0.5" fill="currentColor"/></symbol>
  </defs>

  <rect width="1320" height="640" fill="url(#gCanvas)"/>

  <!-- Shelves outside the workspace -->
  <g data-reveal="shelves">
    <rect x="56" y="120" width="560" height="430" rx="18" fill="#fbf1d6" fill-opacity="0.45" stroke="#daa520" stroke-width="2" stroke-dasharray="7 5"/>
    <g transform="translate(78,134)" color="#b9881d"><use href="#sym-shelf" width="26" height="26"/></g>
    <text x="114" y="153" font-size="15" font-weight="700" letter-spacing="1.5" fill="#8a6d1e">SHELVES — OUTSIDE THE WORKSPACE</text>
    <g filter="url(#soft)"><rect x="88" y="186" width="248" height="338" rx="14" fill="#ffffff" stroke="#ecd9a3"/></g>
    <text x="112" y="224" font-size="19" font-weight="700" fill="#1c2d54">Velocity Shelf</text>
    <g filter="url(#soft)"><rect x="352" y="186" width="232" height="338" rx="14" fill="#ffffff" stroke="#ecd9a3"/></g>
    <text x="376" y="224" font-size="19" font-weight="700" fill="#1c2d54">US Specific Shelf</text>
  </g>

  <!-- Workspace boundary -->
  <g data-reveal="ws">
    <rect x="760" y="120" width="500" height="430" rx="16" fill="#7b4fb5" fill-opacity="0.09" stroke="#7b4fb5" stroke-width="4"/>
    <text x="784" y="152" font-size="15" font-weight="700" letter-spacing="2" fill="#6a44a0">WORKSPACE — DATA BOUNDARY</text>
    <g filter="url(#soft)"><rect x="930" y="280" width="248" height="120" rx="14" fill="#29417a" stroke="#1c2d54"/></g>
    <g transform="translate(956,316)" color="#bcd2f0"><use href="#sym-storage" width="34" height="34"/></g>
    <text x="1000" y="332" font-size="18" font-weight="700" fill="#ffffff">Placed copy</text>
    <text x="1000" y="358" font-size="13.5" fill="#c8d6ee">inside the boundary</text>
  </g>

  <!-- Gold copies on the shelves -->
  <g data-reveal="gold">
    <rect x="116" y="250" width="192" height="116" rx="12" fill="url(#gGold)" stroke="#a87f1e"/>
    <g transform="translate(140,278)" color="#5e4708"><use href="#sym-star" width="30" height="30"/></g>
    <text x="140" y="346" font-size="14.5" font-weight="800" fill="#3f300a">Gold copy — accelerator</text>
    <rect x="378" y="250" width="180" height="116" rx="12" fill="url(#gGold)" stroke="#a87f1e"/>
    <g transform="translate(402,278)" color="#5e4708"><use href="#sym-star" width="30" height="30"/></g>
    <text x="402" y="346" font-size="14.5" font-weight="800" fill="#3f300a">Gold copy — US pkg</text>
  </g>

  <!-- Lift a copy into the boundary -->
  <g data-reveal="lift">
    <path d="M308 300 C 560 300, 660 340, 928 340" fill="none" stroke="#c79a1f" stroke-width="3" marker-end="url(#arwG)"/>
    <path d="M558 318 C 700 360, 800 360, 928 352" fill="none" stroke="#c79a1f" stroke-width="3" marker-end="url(#arwG)"/>
    <text x="640" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#a87f1e">lift a copy in — the shelf stays outside</text>
  </g>
</svg>
