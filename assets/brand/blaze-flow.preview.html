<!doctype html><html><head><meta charset="utf-8">
<title>Blaze flow — graphics standard preview</title>
<style>
 html,body{margin:0;background:#dfe6f1;font-family:'Segoe UI',system-ui,Helvetica,Arial,sans-serif}
 .wrap{max-width:1180px;margin:32px auto;padding:0 16px}
 .card{background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(28,45,84,.22);overflow:hidden}
 .bar{padding:18px 26px;background:linear-gradient(90deg,#1c2d54,#34518f);color:#fff}
 .bar h1{margin:0;font-size:19px;font-weight:700}
 .bar p{margin:4px 0 0;font-size:13px;color:#bcd0ec}
 .stage{padding:22px;background:#eef3fa}
 svg{width:100%;height:auto;display:block;border-radius:10px;background:#f6f9fd}
</style></head><body><div class="wrap"><div class="card">
<div class="bar"><h1>Graphics standard — proof of concept</h1>
<p>Hand-authored SVG · icon kit · brand palette · readable type. This replaces the Mermaid &ldquo;wire&rdquo; diagrams.</p></div>
<div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gCanvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#e7eef8"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34518f"/>
      <stop offset="1" stop-color="#1c2d54"/>
    </linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b91c8"/>
      <stop offset="1" stop-color="#3a6fae"/>
    </linearGradient>
    <linearGradient id="gBlaze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb15a"/>
      <stop offset="0.5" stop-color="#f0822f"/>
      <stop offset="1" stop-color="#d2541a"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#d9a92e"/>
    </linearGradient>
    <linearGradient id="gOrangeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0822f"/>
      <stop offset="1" stop-color="#e8732b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1c2d54" flood-opacity="0.18"/>
    </filter>
    <filter id="softLg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#c2410c" flood-opacity="0.35"/>
    </filter>
    <marker id="arw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11 Z" fill="#6b7da6"/>
    </marker>
    <marker id="arwO" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11 Z" fill="#e8732b"/>
    </marker>

    <!-- ===== Reusable symbol kit (stroke = currentColor) ===== -->
    <symbol id="sym-template" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2.5h8l4 4v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z"/>
      <path d="M14 2.5V6.5h4"/><path d="M8 12h8"/><path d="M8 15.5h8"/><path d="M8 19h5"/>
    </symbol>
    <symbol id="sym-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 l1.7 4.3 L18 9 l-4.3 1.7 L12 15 l-1.7-4.3 L6 9 l4.3-1.7 Z"/>
      <path d="M18.5 14.5 l.8 2 l2 .8 l-2 .8 l-.8 2 l-.8-2 l-2-.8 l2-.8 Z"/>
    </symbol>
    <symbol id="sym-app" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M3 8.5h18"/><circle cx="6" cy="6.2" r="0.6" fill="currentColor"/><circle cx="8.2" cy="6.2" r="0.6" fill="currentColor"/>
    </symbol>
    <symbol id="sym-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5c2.5 3.5 5.5 5.6 5.5 9.8a5.5 5.5 0 0 1-11 0c0-1.7.6-3 1.6-4 .2 1.2.9 2 1.9 2.3-.3-2.6.9-5.5 2-8.1Z"/>
    </symbol>
    <symbol id="sym-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5 4.5 5.5v6c0 4.7 3.2 8.4 7.5 10 4.3-1.6 7.5-5.3 7.5-10v-6Z"/>
      <path d="M8.5 12l2.4 2.4L15.5 9.8"/>
    </symbol>
    <symbol id="sym-approval" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="8" r="3.2"/>
      <path d="M3.8 20c.6-3.3 3.1-5.2 6.2-5.2 1.2 0 2.3.3 3.2.8"/>
      <path d="M15.5 18.2l1.8 1.8 3.4-3.6"/>
    </symbol>
    <symbol id="sym-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 18h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 6.5 9.2 3.9 3.9 0 0 0 7 18Z"/>
    </symbol>
    <symbol id="sym-gateway" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 21V8l8-4.5L20 8v13"/><path d="M9.5 21v-6a2.5 2.5 0 0 1 5 0v6"/><path d="M2.5 21h19"/>
    </symbol>
    <symbol id="sym-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 17V10.5a5.5 5.5 0 0 1 11 0V17l1.8 2.2H4.7Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>
    </symbol>
  </defs>

  <rect width="1320" height="820" fill="url(#gCanvas)"/>

  <!-- ============ ZONE LABELS ============ -->
  <g fill="#8194b8" font-size="15" font-weight="700" letter-spacing="2">
    <text x="52" y="68">BUILD — ANYONE, ANY TOOL</text>
    <text x="922" y="58">DEPLOY</text>
    <text x="52" y="300">COMPLIANCE — OWNED 100% BY BLAZE</text>
    <text x="52" y="556">RUN — GOVERNED ENVIRONMENTS</text>
    <text x="978" y="300">STATUS</text>
  </g>

  <!-- ============ BUILD PIPELINE ============ -->
  <!-- Templates -->
  <g filter="url(#soft)">
    <rect x="50" y="90" width="250" height="132" rx="16" fill="#ffffff" stroke="#d8e1f0"/>
    <rect x="50" y="90" width="250" height="6" rx="3" fill="url(#gGold)"/>
  </g>
  <g transform="translate(74,120)" color="#b9881d"><use href="#sym-template" width="40" height="40"/></g>
  <text x="126" y="140" font-size="22" font-weight="700" fill="#1c2d54">Templates</text>
  <text x="74" y="178" font-size="15" fill="#4a5b80">Starter repos on GitHub,</text>
  <text x="74" y="200" font-size="15" fill="#4a5b80">one per stack — no blank page.</text>

  <!-- Tools -->
  <g filter="url(#soft)">
    <rect x="350" y="90" width="270" height="132" rx="16" fill="#ffffff" stroke="#d8e1f0"/>
    <rect x="350" y="90" width="270" height="6" rx="3" fill="url(#gSteel)"/>
  </g>
  <g transform="translate(374,118)" color="#3a6fae"><use href="#sym-ai" width="38" height="38"/></g>
  <text x="422" y="138" font-size="20" font-weight="700" fill="#1c2d54">Vibe-code in any tool</text>
  <g font-size="14" font-weight="600">
    <g><rect x="374" y="160" width="86" height="30" rx="15" fill="#eaf1fa" stroke="#cdddf0"/><text x="417" y="180" text-anchor="middle" fill="#2f6fae">Lovable</text></g>
    <g><rect x="468" y="160" width="118" height="30" rx="15" fill="#eaf1fa" stroke="#cdddf0"/><text x="527" y="180" text-anchor="middle" fill="#2f6fae">Claude Code</text></g>
    <g><rect x="374" y="196" width="80" height="30" rx="15" fill="#eaf1fa" stroke="#cdddf0"/><text x="414" y="216" text-anchor="middle" fill="#2f6fae">Cursor</text></g>
    <g><rect x="462" y="196" width="98" height="30" rx="15" fill="#eaf1fa" stroke="#cdddf0"/><text x="511" y="216" text-anchor="middle" fill="#2f6fae">any AI</text></g>
  </g>

  <!-- Your app -->
  <g filter="url(#soft)">
    <rect x="670" y="90" width="200" height="132" rx="16" fill="#ffffff" stroke="#d8e1f0"/>
    <rect x="670" y="90" width="200" height="6" rx="3" fill="url(#gSteel)"/>
  </g>
  <g transform="translate(694,120)" color="#3a6fae"><use href="#sym-app" width="38" height="38"/></g>
  <text x="742" y="140" font-size="21" font-weight="700" fill="#1c2d54">Your app</text>
  <text x="694" y="178" font-size="15" fill="#4a5b80">New build —</text>
  <text x="694" y="200" font-size="15" fill="#4a5b80">or a change to an existing one.</text>

  <!-- BLAZE hub -->
  <g filter="url(#softLg)">
    <rect x="922" y="70" width="350" height="170" rx="22" fill="url(#gBlaze)"/>
  </g>
  <g transform="translate(956,108)" color="#ffffff"><use href="#sym-flame" width="64" height="64"/></g>
  <text x="1040" y="138" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="1">BLAZE</text>
  <text x="1040" y="170" font-size="17" font-weight="600" fill="#fff3e8">The Enterprise Vercel</text>
  <text x="956" y="216" font-size="16" fill="#fff3e8">One front door — it deploys what you built.</text>

  <!-- build-flow arrows -->
  <g stroke="#6b7da6" stroke-width="2.4" fill="none" marker-end="url(#arw)">
    <path d="M300 156 H346"/>
    <path d="M620 156 H666"/>
  </g>
  <path d="M870 156 H918" stroke="#e8732b" stroke-width="3.2" fill="none" marker-end="url(#arwO)"/>

  <!-- BLAZE -> Compliance -->
  <path d="M1000 240 C 1000 280, 880 280, 880 318" stroke="#e8732b" stroke-width="3.2" fill="none" marker-end="url(#arwO)"/>
  <!-- BLAZE -> Status -->
  <path d="M1130 240 C 1130 280, 1130 300, 1130 318" stroke="#e8732b" stroke-width="3.2" fill="none" marker-end="url(#arwO)"/>

  <!-- ============ COMPLIANCE PANEL ============ -->
  <g filter="url(#soft)">
    <rect x="50" y="318" width="850" height="190" rx="18" fill="#ffffff" stroke="#f0c9aa"/>
    <rect x="50" y="318" width="850" height="44" rx="18" fill="url(#gOrangeBar)"/>
    <rect x="50" y="344" width="850" height="18" fill="url(#gOrangeBar)"/>
  </g>
  <g transform="translate(70,328)" color="#ffffff"><use href="#sym-shield" width="26" height="26"/></g>
  <text x="106" y="347" font-size="19" font-weight="700" fill="#ffffff">Nothing reaches an environment except through here</text>

  <!-- Automated sub-card -->
  <rect x="74" y="384" width="388" height="104" rx="14" fill="#f4f8fd" stroke="#d8e1f0"/>
  <g transform="translate(94,406)" color="#3a6fae"><use href="#sym-shield" width="34" height="34"/></g>
  <text x="140" y="420" font-size="19" font-weight="700" fill="#1c2d54">Automated checks</text>
  <text x="140" y="446" font-size="15" fill="#4a5b80">Policy · security scans · gates</text>
  <text x="140" y="468" font-size="15" fill="#4a5b80">run automatically on every deploy.</text>

  <!-- Manual sub-card -->
  <rect x="488" y="384" width="388" height="104" rx="14" fill="#fdf6e6" stroke="#ecd9a3"/>
  <g transform="translate(508,406)" color="#b9881d"><use href="#sym-approval" width="34" height="34"/></g>
  <text x="554" y="420" font-size="19" font-weight="700" fill="#1c2d54">Manual gates</text>
  <text x="554" y="446" font-size="15" fill="#4a5b80">Human approvals — tracked and</text>
  <text x="554" y="468" font-size="15" fill="#4a5b80">orchestrated by Blaze, not chased.</text>

  <!-- Compliance -> Environments -->
  <g stroke="#e8732b" stroke-width="3.2" fill="none" marker-end="url(#arwO)">
    <path d="M180 508 C 180 535, 180 535, 180 568"/>
    <path d="M455 508 C 455 535, 455 535, 455 568"/>
    <path d="M735 508 C 735 535, 735 535, 735 568"/>
  </g>

  <!-- ============ ENVIRONMENTS ============ -->
  <!-- Commercial Cloud -->
  <g filter="url(#soft)"><rect x="50" y="570" width="260" height="150" rx="16" fill="url(#gNavy)"/></g>
  <g transform="translate(72,594)" color="#bcd2f0"><use href="#sym-cloud" width="40" height="40"/></g>
  <text x="124" y="618" font-size="21" font-weight="700" fill="#ffffff">Commercial Cloud</text>
  <text x="72" y="660" font-size="15" fill="#c8d6ee">Build and ship apps in the</text>
  <text x="72" y="682" font-size="15" fill="#c8d6ee">commercial estate.</text>
  <g font-size="14" font-weight="700"><rect x="72" y="694" width="58" height="24" rx="12" fill="#ffffff22" stroke="#ffffff55"/><text x="101" y="711" text-anchor="middle" fill="#ffffff">Dev</text>
    <rect x="138" y="694" width="62" height="24" rx="12" fill="#ffffff22" stroke="#ffffff55"/><text x="169" y="711" text-anchor="middle" fill="#ffffff">Prod</text></g>

  <!-- GAC Prod -->
  <g filter="url(#soft)"><rect x="330" y="570" width="240" height="150" rx="16" fill="url(#gNavy)"/></g>
  <g transform="translate(352,594)" color="#bcd2f0"><use href="#sym-cloud" width="40" height="40"/></g>
  <text x="404" y="618" font-size="21" font-weight="700" fill="#ffffff">GAC</text>
  <text x="352" y="660" font-size="15" fill="#c8d6ee">The governed production</text>
  <text x="352" y="682" font-size="15" fill="#c8d6ee">estate.</text>
  <g font-size="14" font-weight="700"><rect x="352" y="694" width="62" height="24" rx="12" fill="#ffffff22" stroke="#ffffff55"/><text x="383" y="711" text-anchor="middle" fill="#ffffff">Prod</text></g>

  <!-- Advisory Digital Gateway -->
  <g filter="url(#soft)"><rect x="590" y="570" width="310" height="150" rx="16" fill="url(#gNavy)"/></g>
  <g transform="translate(612,594)" color="#bcd2f0"><use href="#sym-gateway" width="40" height="40"/></g>
  <text x="664" y="612" font-size="20" font-weight="700" fill="#ffffff">Advisory Digital</text>
  <text x="664" y="636" font-size="20" font-weight="700" fill="#ffffff">Gateway</text>
  <text x="612" y="676" font-size="15" fill="#c8d6ee">Our hosted application —</text>
  <text x="612" y="698" font-size="15" fill="#c8d6ee">organized by country shelf.</text>

  <!-- ============ STATUS PANEL ============ -->
  <g filter="url(#soft)"><rect x="960" y="318" width="312" height="402" rx="18" fill="#ffffff" stroke="#d8e1f0"/></g>
  <g transform="translate(984,340)" color="#e8732b"><use href="#sym-bell" width="30" height="30"/></g>
  <text x="1024" y="362" font-size="20" font-weight="700" fill="#1c2d54">Live status</text>
  <text x="984" y="392" font-size="15" fill="#4a5b80">Where your deploy stands —</text>
  <text x="984" y="412" font-size="15" fill="#4a5b80">right in the Blaze UI.</text>

  <g font-size="16">
    <!-- passed -->
    <circle cx="998" cy="448" r="11" fill="#e7f5ec" stroke="#3ba66a"/><path d="M993 448l3.2 3.2L1004 444" fill="none" stroke="#2e9259" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1018" y="453" fill="#1c2d54" font-weight="600">Build checks passed</text>
    <!-- passed -->
    <circle cx="998" cy="488" r="11" fill="#e7f5ec" stroke="#3ba66a"/><path d="M993 488l3.2 3.2L1004 484" fill="none" stroke="#2e9259" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1018" y="493" fill="#1c2d54" font-weight="600">Policy &amp; scans clear</text>
    <!-- pending -->
    <circle cx="998" cy="528" r="11" fill="#fcefce" stroke="#d9a92e"/><circle cx="998" cy="528" r="2.2" fill="#b9881d"/>
    <text x="1018" y="533" fill="#1c2d54" font-weight="600">Manual approval — pending</text>
    <!-- next -->
    <circle cx="998" cy="568" r="11" fill="#eaf1fa" stroke="#3a6fae"/><path d="M995 563l5 5-5 5" fill="none" stroke="#2f6fae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1018" y="573" fill="#5a6b8f" font-weight="600">Deploy to Prod (queued)</text>
  </g>
  <line x1="984" y1="604" x2="1248" y2="604" stroke="#e6ecf5"/>
  <text x="984" y="636" font-size="15" fill="#4a5b80">Including the manual steps.</text>
  <text x="984" y="660" font-size="17" font-weight="700" fill="#e8732b">You always know where you stand.</text>

  <!-- footer tagline -->
  <text x="660" y="788" text-anchor="middle" font-size="18" font-weight="700" fill="#34518f" letter-spacing="0.5">Anyone builds — or changes — an app, at scale. Blaze deploys it and owns compliance, automatically.</text>
</svg>
</div></div></div></body></html>
