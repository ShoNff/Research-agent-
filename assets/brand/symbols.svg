  </symbol>
  <symbol id="sym-shelf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M3.5 9.5h17M3.5 15h17"/><path d="M6.5 6.5h3M6.5 12h3M6.5 17.5h3"/>
  </symbol>
  <symbol id="sym-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.6 11.6 11.2 4h6.8a2 2 0 0 1 2 2v6.8l-7.6 7.6a1.5 1.5 0 0 1-2.1 0L3.6 13.7a1.5 1.5 0 0 1 0-2.1Z"/><circle cx="16" cy="8" r="1.4"/>
