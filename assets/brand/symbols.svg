<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Reusable icon kit for decks and diagrams.
    Style: 24x24 viewBox, stroke-based, stroke-width 1.8, round caps/joins,
    stroke="currentColor" so the color is set by the consumer (set `color:` on the <use>).
    Usage (must be inlined into a self-contained SVG/deck; cross-file <use> is blocked by CORS):
      <g color="#3a6fae"><use href="#sym-shield" width="34" height="34"/></g>
    Add new symbols here first, then inline into consumers.
  -->
  <symbol id="sym-template" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 2.5h8l4 4v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z"/>
    <path d="M14 2.5V6.5h4"/><path d="M8 12h8"/><path d="M8 15.5h8"/><path d="M8 19h5"/>
  </symbol>
  <symbol id="sym-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 l1.7 4.3 L18 9 l-4.3 1.7 L12 15 l-1.7-4.3 L6 9 l4.3-1.7 Z"/>
    <path d="M18.5 14.5 l.8 2 l2 .8 l-2 .8 l-.8 2 l-.8-2 l-2-.8 l2-.8 Z"/>
  </symbol>
  <symbol id="sym-app" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
