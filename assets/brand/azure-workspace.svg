<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 880" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gCanvas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f9fd"/><stop offset="1" stop-color="#e7eef8"/></linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5fc4"/><stop offset="1" stop-color="#5a3a8c"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#d9a92e"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1c2d54" flood-opacity="0.16"/></filter>
    <marker id="arw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 Z" fill="#6b7da6"/></marker>
    <marker id="arwP" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 Z" fill="#7b4fb5"/></marker>
    <symbol id="sym-identity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3.6 3-5.6 5.5-5.6s4.9 2 5.5 5.6"/><path d="M16 4.4a3 3 0 0 1 0 5.6"/><path d="M18.4 20c-.2-2.1-.9-3.7-2-4.8"/></symbol>
    <symbol id="sym-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 7.5 12 12 3 7.5 12 3Z"/><path d="M3 12l9 4.5L21 12"/><path d="M3 16.5 12 21l9-4.5"/></symbol>
    <symbol id="sym-group" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a1 1 0 0 1 1-1h4.8l2 2.2H20a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="sym-app" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8.5h18"/><circle cx="6" cy="6.2" r="0.6" fill="currentColor"/><circle cx="8.2" cy="6.2" r="0.6" fill="currentColor"/></symbol>
    <symbol id="sym-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></symbol>
    <symbol id="sym-storage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17"/><circle cx="7" cy="7.2" r="0.5" fill="currentColor"/><circle cx="7" cy="12" r="0.5" fill="currentColor"/><circle cx="7" cy="16.8" r="0.5" fill="currentColor"/></symbol>
    <symbol id="sym-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 l1.7 4.3 L18 9 l-4.3 1.7 L12 15 l-1.7-4.3 L6 9 l4.3-1.7 Z"/><path d="M18.5 14.5 l.8 2 l2 .8 l-2 .8 l-.8 2 l-.8-2 l-2-.8 l2-.8 Z"/></symbol>
    <symbol id="sym-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></symbol>
    <symbol id="sym-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M14.8 14.8 20 20"/></symbol>
    <symbol id="sym-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.7 2.7L16.2 9"/></symbol>
    <symbol id="sym-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></symbol>
    <symbol id="sym-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l2.7 5.5 6 .9-4.35 4.24 1.03 6L12 16.9 6.62 19.4l1.03-6L3.3 9.2l6-.9Z"/></symbol>
    <symbol id="sym-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 11.6 11.2 4h6.8a2 2 0 0 1 2 2v6.8l-7.6 7.6a1.5 1.5 0 0 1-2.1 0L3.6 13.7a1.5 1.5 0 0 1 0-2.1Z"/><circle cx="16" cy="8" r="1.4"/></symbol>
  </defs>

  <rect width="1320" height="880" fill="url(#gCanvas)"/>

  <!-- ============ TENANT (identity boundary) ============ -->
  <g data-reveal="tenant">
    <rect x="44" y="104" width="1232" height="752" rx="20" fill="#daa520" fill-opacity="0.05" stroke="#daa520" stroke-width="3"/>
    <g transform="translate(62,118)" color="#b9881d"><use href="#sym-identity" width="30" height="30"/></g>
    <text x="102" y="132" font-size="21" font-weight="800" fill="#1c2d54">KPMG.com Tenant</text>
    <text x="102" y="153" font-size="14" font-weight="600" fill="#8a6d1e">Microsoft Entra ID — one identity boundary, one root of trust</text>
  </g>

  <!-- ============ SUBSCRIPTIONS ============ -->
  <g data-reveal="sub-siblings">
    <rect x="948" y="176" width="312" height="318" rx="14" fill="#eef1f6" stroke="#9db0cf" stroke-width="1.5" stroke-dasharray="6 5"/>
    <g transform="translate(968,196)" color="#7d8db0"><use href="#sym-layers" width="26" height="26"/></g>
    <text x="1004" y="214" font-size="17" font-weight="700" fill="#5a6b8f">GAC Subscription</text>
    <text x="968" y="250" font-size="14" fill="#8294b8">(separate engagement —</text>
    <text x="968" y="270" font-size="14" fill="#8294b8">governed the same way)</text>
    <rect x="948" y="514" width="312" height="318" rx="14" fill="#eef1f6" stroke="#9db0cf" stroke-width="1.5" stroke-dasharray="6 5"/>
    <g transform="translate(968,534)" color="#7d8db0"><use href="#sym-layers" width="26" height="26"/></g>
    <text x="1004" y="552" font-size="17" font-weight="700" fill="#5a6b8f">Germany Subscription</text>
    <text x="968" y="588" font-size="14" fill="#8294b8">(separate engagement —</text>
    <text x="968" y="608" font-size="14" fill="#8294b8">governed the same way)</text>
  </g>
  <g data-reveal="sub-dg">
    <g filter="url(#soft)"><rect x="70" y="176" width="858" height="656" rx="16" fill="#ffffff" stroke="#4682b4" stroke-width="2.5"/><rect x="70" y="176" width="858" height="6" rx="3" fill="#4682b4"/></g>
    <g transform="translate(90,198)" color="#3a6fae"><use href="#sym-layers" width="26" height="26"/></g>
    <text x="126" y="216" font-size="19" font-weight="700" fill="#1c2d54">Digital Gateway Subscription</text>
    <text x="126" y="236" font-size="13.5" font-weight="600" fill="#5a6b8f">billing + access container — we build the engagement here</text>
  </g>

  <!-- ============ WORKSPACE (data boundary) ============ -->
  <g data-reveal="workspace">
    <rect x="92" y="252" width="814" height="560" rx="16" fill="#7b4fb5" fill-opacity="0.09" stroke="#7b4fb5" stroke-width="4"/>
    <text x="112" y="282" font-size="14" font-weight="700" letter-spacing="2" fill="#6a44a0">WORKSPACE — DATA BOUNDARY</text>
  </g>

  <!-- ============ RESOURCE GROUPS (A + B) ============ -->
  <g data-reveal="rgs">
    <rect x="118" y="304" width="430" height="128" rx="12" fill="#ffffff" stroke="#d8e1f0"/>
    <g transform="translate(132,318)" color="#3a6fae"><use href="#sym-group" width="22" height="22"/></g>
    <text x="162" y="335" font-size="16" font-weight="700" fill="#1c2d54">Resource Group A</text>
    <rect x="118" y="448" width="430" height="150" rx="12" fill="#ffffff" stroke="#d8e1f0"/>
    <g transform="translate(132,462)" color="#3a6fae"><use href="#sym-group" width="22" height="22"/></g>
    <text x="162" y="479" font-size="16" font-weight="700" fill="#1c2d54">Resource Group B</text>
  </g>

  <!-- region chips (every RG has a home) -->
  <g data-reveal="region">
    <rect x="402" y="316" width="132" height="26" rx="13" fill="#fbf3da" stroke="#ecd9a3"/><text x="468" y="333" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6d1e">East US · Virginia</text>
    <rect x="402" y="460" width="132" height="26" rx="13" fill="#fbf3da" stroke="#ecd9a3"/><text x="468" y="477" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6d1e">East US · Virginia</text>
    <rect x="402" y="624" width="132" height="26" rx="13" fill="#fbf3da" stroke="#ecd9a3"/><text x="468" y="641" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a6d1e">East US · Virginia</text>
  </g>

  <!-- ============ RESOURCES (app, db, storage) ============ -->
  <g data-reveal="resources">
    <rect x="138" y="356" width="244" height="60" rx="10" fill="#eef3fb" stroke="#cdddf0"/>
    <g transform="translate(152,371)" color="#3a6fae"><use href="#sym-app" width="30" height="30"/></g>
    <text x="190" y="392" font-size="15" font-weight="600" fill="#29417a">App Service</text>
    <rect x="138" y="500" width="180" height="60" rx="10" fill="#eaf0fb" stroke="#cdddf0"/>
    <g transform="translate(150,515)" color="#29417a"><use href="#sym-database" width="30" height="30"/></g>
    <text x="186" y="536" font-size="14.5" font-weight="600" fill="#29417a">SQL Database</text>
    <rect x="344" y="500" width="186" height="60" rx="10" fill="#eaf0fb" stroke="#cdddf0"/>
    <g transform="translate(356,515)" color="#29417a"><use href="#sym-storage" width="30" height="30"/></g>
    <text x="392" y="536" font-size="14.5" font-weight="600" fill="#29417a">Storage Acct</text>
  </g>

  <!-- ============ EXTEND (RG C added mid-engagement) ============ -->
  <g data-reveal="extend">
    <rect x="118" y="612" width="430" height="124" rx="12" fill="#ffffff" stroke="#7b4fb5" stroke-width="1.6" stroke-dasharray="7 5"/>
    <g transform="translate(132,626)" color="#7b4fb5"><use href="#sym-group" width="22" height="22"/></g>
    <text x="162" y="643" font-size="16" font-weight="700" fill="#1c2d54">Resource Group C</text>
    <text x="300" y="643" font-size="12.5" font-weight="700" fill="#7b4fb5">+ added mid-engagement</text>
    <rect x="138" y="664" width="244" height="56" rx="10" fill="#f3eefb" stroke="#dccdf0"/>
    <g transform="translate(152,677)" color="#7b4fb5"><use href="#sym-app" width="28" height="28"/></g>
    <text x="188" y="697" font-size="15" font-weight="600" fill="#5a3a8c">App 2</text>
  </g>

  <!-- ============ DATA — VIRTUAL (app -> db -> storage) ============ -->
  <g data-reveal="datavirtual">
    <path d="M196 416 V 500" fill="none" stroke="#6b7da6" stroke-width="2.4" marker-end="url(#arw)"/>
    <path d="M318 530 H 344" fill="none" stroke="#6b7da6" stroke-width="2.4" marker-end="url(#arw)"/>
    <text x="206" y="462" font-size="12" font-weight="600" fill="#6b7da6">writes</text>
  </g>

  <!-- ============ AGENT LOOP ============ -->
  <g data-reveal="agents">
    <rect x="572" y="304" width="318" height="478" rx="14" fill="#eef3fb" stroke="#cdddf0"/>
    <g transform="translate(586,316)" color="#3a6fae"><use href="#sym-ai" width="22" height="22"/></g>
    <text x="616" y="333" font-size="15" font-weight="700" letter-spacing="1" fill="#29417a">AGENT LOOP</text>
    <rect x="592" y="348" width="262" height="50" rx="12" fill="#4682b4" stroke="#29417a"/>
    <g transform="translate(606,360)" color="#ffffff"><use href="#sym-ai" width="26" height="26"/></g>
    <text x="640" y="378" font-size="15" font-weight="700" fill="#ffffff">Agents</text>
    <rect x="592" y="410" width="262" height="50" rx="12" fill="#eef3fb" stroke="#4682b4"/>
    <g transform="translate(606,422)" color="#3a6fae"><use href="#sym-gear" width="26" height="26"/></g>
    <text x="640" y="440" font-size="15" font-weight="600" fill="#29417a">App Configuration</text>
    <path d="M723 398 V 410" fill="none" stroke="#7b4fb5" stroke-width="2.4" marker-end="url(#arwP)"/>
  </g>
  <g data-reveal="inspect">
    <rect x="592" y="472" width="262" height="50" rx="12" fill="#eef3fb" stroke="#4682b4"/>
    <g transform="translate(606,484)" color="#3a6fae"><use href="#sym-search" width="26" height="26"/></g>
    <text x="640" y="502" font-size="15" font-weight="600" fill="#29417a">Inspect changes</text>
    <rect x="592" y="534" width="262" height="50" rx="12" fill="#eef3fb" stroke="#4682b4"/>
    <g transform="translate(606,546)" color="#2e9259"><use href="#sym-check" width="26" height="26"/></g>
    <text x="640" y="564" font-size="15" font-weight="600" fill="#29417a">Evaluate: good?</text>
    <path d="M723 460 V 472" fill="none" stroke="#7b4fb5" stroke-width="2.4" marker-end="url(#arwP)"/>
    <path d="M723 522 V 534" fill="none" stroke="#7b4fb5" stroke-width="2.4" marker-end="url(#arwP)"/>
  </g>
  <g data-reveal="backlog">
    <rect x="592" y="596" width="262" height="50" rx="12" fill="#29417a" stroke="#1c2d54"/>
    <g transform="translate(606,608)" color="#bcd2f0"><use href="#sym-list" width="26" height="26"/></g>
    <text x="640" y="626" font-size="15" font-weight="700" fill="#ffffff">Backlog / Master List</text>
    <rect x="592" y="658" width="262" height="50" rx="12" fill="url(#gGold)" stroke="#a87f1e"/>
    <g transform="translate(606,670)" color="#5e4708"><use href="#sym-star" width="26" height="26"/></g>
    <text x="640" y="688" font-size="15" font-weight="800" fill="#3f300a">Golden Instance</text>
    <path d="M723 584 V 596" fill="none" stroke="#7b4fb5" stroke-width="2.4" marker-end="url(#arwP)"/>
    <path d="M723 646 V 658" fill="none" stroke="#7b4fb5" stroke-width="2.4" marker-end="url(#arwP)"/>
    <path d="M854 683 C 882 660, 882 396, 854 373" fill="none" stroke="#7b4fb5" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arwP)"/>
    <text x="866" y="536" font-size="11.5" font-weight="700" fill="#7b4fb5" transform="rotate(90 866 536)">continuous loop</text>
  </g>

  <!-- ============ ENGAGEMENT NUMBER (governance) ============ -->
  <g data-reveal="engagement">
    <path d="M232 90 C 232 150, 150 175, 150 250" fill="none" stroke="#7b4fb5" stroke-width="3" marker-end="url(#arwP)"/>
    <g filter="url(#soft)"><rect x="44" y="32" width="372" height="56" rx="28" fill="url(#gPurple)"/></g>
    <g transform="translate(66,46)" color="#ffffff"><use href="#sym-tag" width="28" height="28"/></g>
    <text x="104" y="67" font-size="17" font-weight="800" fill="#ffffff">KPMG Engagement #ENG-12345</text>
  </g>
</svg>
