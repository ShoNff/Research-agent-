<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Research Library">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b62a8"/>
      <stop offset="1" stop-color="#131d36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2cd7a"/>
      <stop offset="1" stop-color="#e8b64c"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="222" cy="222" r="104"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- magnifier handle -->
  <line x1="300" y1="300" x2="404" y2="404" stroke="url(#gold)" stroke-width="46" stroke-linecap="round"/>

  <!-- document lines being examined (the "research") -->
  <g clip-path="url(#lens)">
    <rect x="150" y="178" width="150" height="20" rx="10" fill="#dce6fb"/>
    <rect x="150" y="212" width="144" height="20" rx="10" fill="#aebbd9"/>
    <rect x="150" y="246" width="104" height="20" rx="10" fill="#aebbd9"/>
  </g>

  <!-- lens ring -->
  <circle cx="222" cy="222" r="104" fill="none" stroke="url(#gold)" stroke-width="34"/>
</svg>
