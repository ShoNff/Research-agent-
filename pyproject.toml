[project]
name = "research-agent"
version = "0.1.0"
description = "Multi-agent research system powered by Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.40",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "Jinja2>=3.1.0",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "click>=8.0",
    "tavily-python>=0.5.0",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
